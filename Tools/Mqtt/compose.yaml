services:
  broker:
    image: eclipse-mosquitto:2.0.22
    ports:
      - "${MQTT_BIND_ADDRESS:-127.0.0.1}:1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
  python-edge:
    profiles: ["simulated-edge"]
    build:
      context: ../Edge
    environment:
      MQTT_HOST: broker
      MQTT_PORT: 1883
    depends_on:
      - broker
    restart: unless-stopped
