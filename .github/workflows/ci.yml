# Stage 1: checks that need no Unity license and never download Git LFS objects
# (keeps the repo owner's LFS bandwidth quota intact). Unity CI via GameCI follows after Sep 30.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Unity repo hygiene and docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check .meta pairs, Unity version, local files, and file sizes
        run: python Tools/CI/check_unity_repo.py
      - name: Check documentation links
        run: python Tools/CI/check_doc_links.py

  edge-python:
    name: Python edge and broker config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"  # Matches the Tools/Edge/Dockerfile image.
      - name: Check Python syntax
        run: python -m py_compile Tools/Edge/*.py Tools/telemetry_server.py Tools/CI/*.py Tools/UI/*.py
      - name: Run edge decision unit tests
        run: python -m unittest discover -s Tools/Edge/tests -v
      - name: Validate docker compose
        run: docker compose --profile simulated-edge -f Tools/Mqtt/compose.yaml config --quiet
